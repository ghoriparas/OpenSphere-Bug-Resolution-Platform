{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card" style="padding: 2.5rem 2rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 60px; height: 60px; background: rgba(99, 102, 241, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: var(--primary); font-size: 1.8rem;">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="page-title" style="font-size: 1.5rem;">Sign In to OpenSphere</h2>
            <p class="page-subtitle">OSTF Open Source Project & Bug Tracker</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-user"></i> Username</label>
                <input type="text" name="username" class="form-control" placeholder="e.g. admin or paras" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-key"></i> Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
            <p style="color: var(--text-muted); font-size: 0.9rem;">
                Don't have an account? <a href="{{ url_for('register') }}">Create an account</a>
            </p>
            <div style="margin-top: 1rem; background: var(--bg-glass); padding: 0.75rem; border-radius: var(--radius-sm); font-size: 0.8rem; color: var(--text-dim);">
                <strong>Default Demo Logins:</strong><br>
                Admin: <code>admin</code> / <code>admin123</code><br>
                Developer: <code>paras</code> / <code>paras123</code>
            </div>
        </div>
    </div>
</div>
{% endblock %}
