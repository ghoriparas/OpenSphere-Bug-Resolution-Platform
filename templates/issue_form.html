{% extends "base.html" %}
{% block title %}Report Issue{% endblock %}

{% block content %}
<div style="max-width: 700px; margin: 1.5rem auto;">
    <div class="card" style="padding: 2rem;">
        <div class="page-header" style="margin-bottom: 1.5rem;">
            <div>
                <h2 class="page-title" style="font-size: 1.4rem;">Report New Issue</h2>
                <p class="page-subtitle">Submit a bug report, feature request, or technical task.</p>
            </div>
            <a href="{{ url_for('issues') }}" class="btn btn-secondary" style="font-size: 0.85rem;">Back</a>
        </div>

        <form method="POST">
            <div class="form-group">
                <label class="form-label">Issue Title *</label>
                <input type="text" name="title" class="form-control" placeholder="Brief summary of the issue..." required>
            </div>

            <div class="form-group">
                <label class="form-label">Associated Project *</label>
                <select name="project_id" class="form-control" required>
                    {% for proj in projects %}
                    <option value="{{ proj.id }}" {% if request.args.get('project_id') == proj.id|string %}selected{% endif %}>
                        {{ proj.title }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label">Type</label>
                    <select name="issue_type" class="form-control">
                        <option value="Bug">Bug (Fix required)</option>
                        <option value="Feature">New Feature</option>
                        <option value="Enhancement">Enhancement</option>
                        <option value="Task">General Task</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Priority</label>
                    <select name="priority" class="form-control">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                        <option value="Critical">Critical</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-control">
                        <option value="Open" selected>Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Assign To Developer</label>
                <select name="assigned_to_id" class="form-control">
                    <option value="">-- Leave Unassigned --</option>
                    {% for u in users %}
                    <option value="{{ u.id }}">{{ u.username }} ({{ u.role }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Detailed Description & Steps to Reproduce *</label>
                <textarea name="description" rows="5" class="form-control" placeholder="Describe the expected vs actual behavior, error messages, or requirements..." required></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                <a href="{{ url_for('issues') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-paper-plane"></i> Submit Issue
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
